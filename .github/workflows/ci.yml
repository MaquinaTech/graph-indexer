name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite (the index store) needs Node.js 22.5+
        os: [ubuntu-latest]
        node-version: ["22", "24"]
        include:
          - os: macos-latest
            node-version: "22"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No install step: graph-indexer has no dependencies (tree-sitter and grammars are vendored).
      - name: Unit and integration tests
        run: npm test

      - name: Verify MIT license
        run: |
          node -e "const p=require('./package.json'); if (p.license !== 'MIT') { console.error('license must be MIT, got ' + p.license); process.exit(1); }"
          grep -q 'MIT License' LICENSE

      # The published tarball must work on its own: pack it, unpack it elsewhere, index a small
      # repository with the packed CLI and query it.
      - name: Package integrity
        shell: bash
        run: |
          set -euo pipefail
          TGZ=$(npm pack --silent | tail -1)
          WORK="$RUNNER_TEMP/gi-pack"
          rm -rf "$WORK" && mkdir -p "$WORK/repo/src"
          tar -xzf "$TGZ" -C "$WORK"
          PKG="$WORK/package"
          for d in bin src vendor/grammars vendor/web-tree-sitter; do
            [ -d "$PKG/$d" ] || { echo "missing $d/ in tarball"; exit 1; }
          done
          cat > "$WORK/repo/src/cart.ts" <<'TS'
          export class Cart {
            total(): number { return 0; }
          }
          export function checkout(c: Cart) { return c.total(); }
          TS
          git -C "$WORK/repo" init -q
          node "$PKG/bin/graph-indexer.mjs" index --repo "$WORK/repo"
          node "$PKG/bin/graph-indexer.mjs" search "cart total" --repo "$WORK/repo" | tee "$WORK/search.txt"
          grep -q "Cart.total" "$WORK/search.txt"
          node "$PKG/bin/graph-indexer.mjs" refs Cart.total --repo "$WORK/repo" | tee "$WORK/refs.txt"
          grep -q "in checkout" "$WORK/refs.txt"
