name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22 is required for the SQLite parity gate: the disk-backed store uses
        # node:sqlite (DatabaseSync), which only exists on Node 22+. 18/20 still
        # cover the default in-memory path.
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf-8'))" && echo "✓ package.json is valid JSON"

      - name: Verify MIT license
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf-8'));
            if (pkg.license !== 'MIT') { console.error('✗ License must be MIT, got: ' + pkg.license); process.exit(1); }
            console.log('✓ License: MIT');
          "
          grep -q 'MIT License' LICENSE && echo '✓ LICENSE file OK'

      - name: Verify required files
        run: |
          for file in engine/memory.mjs engine/sqlite.mjs engine/binary.mjs mcp/tools.mjs parse/extractor.mjs parse/languages.mjs storage.mjs indexer.mjs watch-daemon.mjs mcp-server.mjs init.mjs prompts/CORE.md prompts/INTEGRATION.md README.md LICENSE; do
            [ -f "$file" ] && echo "✓ $file exists" || (echo "✗ $file missing"; exit 1)
          done

      - name: Verify supported languages
        run: |
          # Verify LANGUAGE_MAP includes all required extensions
          grep -qF "'.ts': TypeScript.typescript" parse/languages.mjs && echo "✓ TypeScript support"
          grep -qF "'.js': JavaScript" parse/languages.mjs && echo "✓ JavaScript support"
          grep -qF "'.py': Python" parse/languages.mjs && echo "✓ Python support"
          grep -qF "'.rs': Rust" parse/languages.mjs && echo "✓ Rust support"
          grep -qF "'.go': Go" parse/languages.mjs && echo "✓ Go support"
          grep -qF "'.php': PHP" parse/languages.mjs && echo "✓ PHP support"
          grep -qF "'.java': Java" parse/languages.mjs && echo "✓ Java support"
          grep -qF "'.kt': Kotlin" parse/languages.mjs && echo "✓ Kotlin support"
          grep -qF "'.cs': CSharp" parse/languages.mjs && echo "✓ C# support"
          grep -qF "'.rb': Ruby" parse/languages.mjs && echo "✓ Ruby support"
          grep -qF "'.css': CSS" parse/languages.mjs && echo "✓ CSS/SCSS support"
          grep -qF "'.c': C" parse/languages.mjs && echo "✓ C support"
          grep -qF "'.sh': Bash" parse/languages.mjs && echo "✓ Bash support"
          grep -qF "'.swift': Swift" parse/languages.mjs && echo "✓ Swift support"
          echo "✓ All 14 languages verified"

      # Guards the v2.0.0 packaging regression: the `files` allowlist must ship the
      # engine/, mcp/, parse/ subdir modules (a bare `*.mjs` glob does NOT), and every
      # entrypoint must resolve its imports from the published tarball — not just from
      # the dev tree. Fails loudly if a future edit drops a directory from `files`.
      - name: Package integrity (tarball ships subdir modules + entrypoints load)
        run: |
          TGZ=$(npm pack --silent | tail -1)
          rm -rf /tmp/gi-pack && mkdir -p /tmp/gi-pack
          tar -xzf "$TGZ" -C /tmp/gi-pack
          PKG=/tmp/gi-pack/package
          for d in engine mcp parse; do
            ls "$PKG/$d"/*.mjs >/dev/null 2>&1 && echo "✓ $d/ shipped in tarball" || { echo "✗ $d/ missing from published tarball"; exit 1; }
          done
          ln -s "$PWD/node_modules" "$PKG/node_modules"
          ( cd "$PKG" && node --input-type=module -e "for (const m of ['./engine/memory.mjs','./engine/sqlite.mjs','./mcp/tools.mjs','./parse/extractor.mjs','./storage.mjs','./embedders/setup-mlx.mjs']) await import(m); console.log('✓ deep imports resolve from tarball')" )
          ( cd "$PKG" && node init.mjs --help >/dev/null && echo "✓ graph-indexer (init) bin loads from tarball" )

      - name: Unit tests (pure helpers, no fixtures)
        run: npm run test:unit

      - name: Build index on this codebase
        run: |
          INDEXER_EMBEDDINGS=off node indexer.mjs --repo .
        env:
          INDEXER_EMBEDDINGS: "off"

      - name: Setup test fixtures
        run: |
          node test/setup.mjs

      - name: Lexical-only tests (no Ollama)
        run: |
          INDEXER_EMBEDDINGS=off npm test
        env:
          INDEXER_EMBEDDINGS: "off"

      # The memory↔SQLite byte-identical-top-5 parity guarantee is a headline
      # feature, but it can only be exercised where node:sqlite exists (Node 22+),
      # so it is gated to the 22 job. On the 22.x line node:sqlite is still behind
      # --experimental-sqlite; we pass the flag AND assert DatabaseSync actually
      # loads first, so the gate fails loudly if the backend is missing instead of
      # passing as a no-op. Runs after the lexical tests so the fixtures are indexed
      # and the gate covers the full real-corpus query set, not just the synthetic one.
      - name: SQLite parity gate (Node 22)
        if: matrix.node-version == '22'
        run: |
          node --experimental-sqlite -e "const { DatabaseSync } = require('node:sqlite'); if (!DatabaseSync) { console.error('✗ node:sqlite unavailable — parity gate would be a no-op'); process.exit(1); } console.log('✓ node:sqlite (DatabaseSync) available');"
          INDEXER_EMBEDDINGS=off node --experimental-sqlite test/sqlite.mjs
        env:
          INDEXER_EMBEDDINGS: "off"

      - name: Verify index files created
        run: |
          [ -f .graph-indexer/code-index.json ] && echo "✓ code-index.json created" || (echo "✗ .graph-indexer/code-index.json missing"; exit 1)
